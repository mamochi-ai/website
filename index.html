<title>うつろい暦</title>

<meta name="description" content="七十二候を、一枚の屏風で。端末の中だけで天文計算し、今日の候・月の満ち欠け・空の色を描く、通信しない暦。">
<meta name="theme-color" content="#120f0d">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: one living byōbu — the painted scene runs edge to edge; the micro-season stands in vertical type at top right; the year turns as a lacquer-and-gold wheel under the thumb. */
:root {
  --lacquer: #120f0d;
  --lacquer-2: #1f1915;
  --gold: #c9a24b;
  --gold-hi: #f0d891;
  --gold-lo: #8a6424;
  --shu: #c23a2b;
  --washi: #f4efe4;
  --sumi: #1f1b19;
  --ink: #1d1a19;
  --ink-halo: rgba(255, 250, 238, .62);
  --ko-color: #c9a24b;
  --f-min: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", "BIZ UDPMincho", "MS PMincho", "IPAexMincho", "IPAMincho", "IPAPMincho", "IPAPGothic", "IPAGothic", serif;
  --f-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", "IPAPGothic", "IPAGothic", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --dial-h: 118px;
  --panels: 3;
  color-scheme: dark;
}
:root.ink-light { --ink: #f7f1e3; --ink-halo: rgba(6, 9, 22, .58); }

html, body { height: 100%; margin: 0; background: var(--lacquer); color: var(--washi); overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { font-family: var(--f-sans); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }

/* ---------- 舞台 ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--lacquer); }
#stage.dragging { cursor: grabbing; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .2; background-size: 256px 256px; }
#seams {
  position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 30%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, .05) 99.5%, rgba(255, 246, 220, .09) 99.5%, rgba(255, 246, 220, .09) 100%);
  background-size: calc(100% / var(--panels)) 100%;
}

/* ---------- 題（縦書き） ---------- */
.ko {
  position: absolute; z-index: 3;
  top: calc(var(--safe-t) + 14px); right: calc(var(--safe-r) + 8px);
  padding: 8px 6px; margin: 0; cursor: pointer; text-align: start; box-sizing: content-box;
  color: var(--ink); font-family: var(--f-min);
  text-shadow: 0 0 14px var(--ink-halo), 0 0 3px var(--ink-halo);
  transition: color .9s ease, text-shadow .9s ease, opacity .8s ease, transform .8s ease;
  opacity: 0;
}
.ko-v {
  writing-mode: vertical-rl; display: block;
  height: min(calc(100vh - var(--dial-h) - var(--safe-b) - var(--safe-t) - 150px), 600px);
  height: min(calc(100dvh - var(--dial-h) - var(--safe-b) - var(--safe-t) - 150px), 600px);
}
.ready .ko { opacity: 1; }
.ko-v > span { display: block; margin-block-end: 10px; }
.ko-v > span:last-child { margin-block-end: 0; }
.ko-sekki { font-size: 13px; letter-spacing: .32em; opacity: .9; }
.ko-phase { margin-inline-start: .5em; padding-inline-start: .5em; border-inline-start: 1px solid currentColor; }
.ko-kanji { font-size: clamp(48px, 15.5vw, 128px); line-height: 1.02; font-weight: 600; letter-spacing: .05em; }
#kanji span { display: inline; }
.ready #kanji span { animation: inkIn 1.3s cubic-bezier(.2, .7, .2, 1) calc(var(--i) * .13s + .15s) both; }
.ko.swap #kanji span { animation: swapIn .42s ease calc(var(--i) * .035s) both; }
@keyframes inkIn { from { opacity: 0; filter: blur(12px); } 60% { opacity: .9; filter: blur(1px); } to { opacity: 1; filter: none; } }
@keyframes swapIn { from { opacity: .15; filter: blur(5px); } to { opacity: 1; filter: none; } }
.seal {
  display: inline-flex; writing-mode: vertical-rl; flex-direction: column; justify-content: center; align-items: center; gap: 1px;
  inline-size: 34px; block-size: 34px; margin-block-start: 12px; vertical-align: top;
  background: var(--shu); color: #fbefe6; border-radius: 3px; transform: rotate(-3deg);
  font: 600 10px/1 var(--f-min); letter-spacing: 0; text-shadow: none;
  box-shadow: inset 0 0 0 2px rgba(255, 230, 220, .18), 0 1px 0 rgba(0, 0, 0, .15);
}
.seal span:last-child { font-size: 9px; opacity: .92; }
.ko-yomi { font-size: 13.5px; letter-spacing: .28em; }
.ko-mean { font-size: 12.5px; line-height: 1.7; letter-spacing: .08em; opacity: .9; max-inline-size: 24em; }
.ko-date { font-size: 12px; letter-spacing: .14em; opacity: .85; }

/* ---------- 道具 ---------- */
.tools {
  position: absolute; z-index: 4; display: flex; gap: 12px;
  left: calc(var(--safe-l) + 14px); bottom: calc(var(--dial-h) + var(--safe-b) + 18px);
  opacity: 0; transform: translateY(8px); transition: opacity .8s ease .5s, transform .8s ease .5s;
}
.ready .tools { opacity: 1; transform: none; }
.tool {
  position: relative; width: 46px; height: 46px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid rgba(201, 162, 75, .6); background: rgba(18, 15, 13, .5);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: var(--gold-hi); display: grid; place-items: center;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .25), inset 0 0 0 3px rgba(201, 162, 75, .12);
  transition: background .3s, color .3s, transform .15s;
}
.tool:active { transform: scale(.94); }
.tool .glyph { font: 600 19px/1 var(--f-min); }
.tool .lab { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); font: 10px/1 var(--f-sans); letter-spacing: .12em; color: var(--gold-hi); white-space: nowrap; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); }
.tool[aria-pressed="true"] { background: var(--gold); color: var(--lacquer); }
.tool.remember:not([aria-pressed="true"])::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--shu); }
.tool.busy { animation: busy 1s ease-in-out infinite; }
@keyframes busy { 50% { box-shadow: 0 0 0 6px rgba(201, 162, 75, .25); } }

/* ---------- 年輪のダイヤル ---------- */
#dialWrap {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  height: calc(var(--dial-h) + var(--safe-b));
  touch-action: none; cursor: ew-resize;
  background: linear-gradient(to top, rgba(14, 11, 9, .94) 0%, rgba(14, 11, 9, .8) 52%, rgba(14, 11, 9, .35) 80%, rgba(14, 11, 9, 0) 100%);
  transform: translateY(30px); opacity: 0; transition: transform 1s cubic-bezier(.2, .8, .2, 1) .3s, opacity 1s ease .3s;
}
.ready #dialWrap { transform: none; opacity: 1; }
#dial { position: absolute; left: 0; top: 0; width: 100%; height: var(--dial-h); display: block;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent); mask-image: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent); }
#needle { position: absolute; left: 50%; top: 34px; width: 2px; height: 30px; margin-left: -1px; background: linear-gradient(#ff8a6a, var(--shu)); border-radius: 1px; box-shadow: 0 0 10px rgba(226, 80, 50, .7); pointer-events: none; }
#needle::before { content: ""; position: absolute; left: -4px; top: -5px; border: 5px solid transparent; border-top-color: #ff8a6a; }
#chip { position: absolute; left: 50%; top: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; }
#chipText { margin: 0; min-width: 10.5em; text-align: center; font: 15px/1 var(--f-min); letter-spacing: .08em; color: #f7e6b8; text-shadow: 0 1px 6px rgba(0, 0, 0, .9); font-variant-numeric: tabular-nums; white-space: nowrap; }
#chipToday { display: inline-block; margin-right: .5em; padding: 2px 5px 3px; font-size: 11px; letter-spacing: .1em; color: #fff3e6; background: var(--shu); border-radius: 2px; transform: translateY(-1px); }
.arrow { width: 32px; height: 32px; border-radius: 50%; padding: 0; border: 1px solid rgba(201, 162, 75, .45); background: rgba(18, 15, 13, .55); cursor: pointer; display: grid; place-items: center; }
.arrow svg { width: 14px; height: 14px; fill: none; stroke: var(--gold-hi); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.arrow:active { transform: scale(.92); }
.now {
  position: absolute; right: calc(var(--safe-r) + 14px); top: -60px;
  padding: 10px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(226, 90, 60, .75); background: rgba(18, 15, 13, .62); color: #ffd9c8;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  font: 13px/1 var(--f-min); letter-spacing: .14em; box-shadow: 0 4px 18px rgba(0, 0, 0, .3);
  animation: rise .45s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- 案内 ---------- */
#hint { position: absolute; left: 50%; bottom: calc(var(--dial-h) + var(--safe-b) + 96px); transform: translateX(-50%); z-index: 5; text-align: center; pointer-events: none; opacity: 0; transition: opacity .6s ease; width: min(88vw, 360px); }
#hint.show { opacity: 1; }
#hint p { margin: 8px 0 0; font: 15px/1.5 var(--f-min); letter-spacing: .12em; color: #fff7e8; text-shadow: 0 1px 10px rgba(0, 0, 0, .85); }
#hint p.sub { font-size: 11.5px; letter-spacing: .08em; opacity: .85; }
.hint-hand { position: relative; height: 34px; width: 150px; margin: 0 auto; }
.hint-hand::before { content: ""; position: absolute; left: 10px; right: 10px; top: 16px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 240, 210, .7), transparent); }
.hint-hand .dot { position: absolute; top: 5px; left: 0; width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 246, 228, .85); box-shadow: 0 0 0 6px rgba(255, 246, 228, .18), 0 0 18px rgba(255, 230, 190, .6); animation: swipe 2.4s ease-in-out infinite; }
@keyframes swipe { 0%, 100% { transform: translateX(118px); opacity: 0; } 12% { opacity: 1; } 50% { transform: translateX(10px); opacity: 1; } 62% { opacity: 0; } }

/* ---------- 知らせ ---------- */
#toast { position: absolute; z-index: 6; left: 50%; top: calc(var(--safe-t) + 14px); transform: translate(-50%, -6px); max-width: min(86vw, 420px);
  padding: 10px 16px 11px; border-radius: 10px; background: rgba(18, 15, 13, .78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(201, 162, 75, .45); color: #f6e7c1; text-align: center; opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast b { display: block; font: 600 15px/1.4 var(--f-min); letter-spacing: .1em; }
#toast span { display: block; margin-top: 3px; font-size: 11.5px; letter-spacing: .05em; opacity: .85; }
#toast .stamp { display: inline-block; padding: 4px 10px; color: #fff3ea; background: var(--shu); border-radius: 3px; letter-spacing: .3em; transform: rotate(-2deg); }

/* ---------- 巻物 ---------- */
#scroll { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8, 6, 5, 0); transition: background .5s ease; }
#scroll.open { background: rgba(8, 6, 5, .5); }
.scroll-frame {
  --fw: min(calc(100vw - 28px - var(--safe-l) - var(--safe-r)), 1040px);
  position: relative; width: var(--fw);
  height: min(calc(100% - var(--safe-t) - var(--safe-b) - 70px), 780px);
  display: flex; flex-direction: column;
  clip-path: inset(0 0 0 100%); transition: clip-path .75s cubic-bezier(.3, .7, .2, 1);
  filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .5));
}
#scroll.open .scroll-frame { clip-path: inset(-20px -30px -20px -30px); }
#scroll.closing .scroll-frame { clip-path: inset(0 0 0 100%); transition-duration: .5s; }
.scroll-silk {
  flex: 0 0 20px; position: relative;
  background-color: var(--ko-color);
  background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .08) 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 7px), linear-gradient(rgba(0, 0, 0, .12), rgba(0, 0, 0, .12));
}
.scroll-silk.top { border-radius: 2px 2px 0 0; box-shadow: inset 0 -2px 0 var(--gold); }
.scroll-silk.bottom { border-radius: 0 0 2px 2px; box-shadow: inset 0 2px 0 var(--gold); }
.scroll-paper {
  flex: 1 1 auto; min-height: 0; position: relative;
  writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; touch-action: pan-x;
  background-color: #f4efe3; color: var(--sumi);
  background-image: linear-gradient(90deg, rgba(120, 90, 40, .05), rgba(120, 90, 40, 0) 6%, rgba(120, 90, 40, 0) 94%, rgba(120, 90, 40, .06));
  -webkit-user-select: text; user-select: text;
  scrollbar-width: thin; scrollbar-color: rgba(138, 100, 36, .5) transparent;
}
.scroll-paper::before { content: ""; position: fixed; inset: 0; pointer-events: none; }
.scroll-body {
  display: flex; flex-direction: column; gap: 34px;
  padding: 26px 30px 22px 72px; box-sizing: border-box; block-size: auto; inline-size: 100%;
  font: 17px/1.95 var(--f-min); letter-spacing: .06em;
}
.scroll-body h2, .scroll-body h3, .scroll-body p, .scroll-body ul, .scroll-body figure, .scroll-body blockquote { margin: 0; }
.sc-head { display: flex; flex-direction: column; gap: 8px; }
.sc-no { font-size: 13px; letter-spacing: .3em; color: #6e5a3a; }
.sc-sekki { letter-spacing: .1em; }
.sc-kanji { font-size: 46px; line-height: 1.1; font-weight: 600; letter-spacing: .08em; color: #1a1614; }
.sc-yomi { font-size: 14px; letter-spacing: .3em; color: #5d5040; }
.sc-date { font-size: 13px; letter-spacing: .12em; color: #6e5a3a; }
.sc-mean { font-size: 19px; font-weight: 600; }
.sc-note { max-inline-size: 26em; text-align: justify; }
.sc-color { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.sc-color .chip { inline-size: 120px; block-size: 34px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), 0 1px 0 rgba(255, 255, 255, .6); }
.sc-color figcaption { display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; }
.sc-color b { font-size: 20px; letter-spacing: .12em; }
.lbl, .scroll-body h3 { font-size: 12px; font-weight: 400; letter-spacing: .32em; color: #8a6a35; }
.cy { font-size: 12px; letter-spacing: .2em; color: #6b5d4b; }
.hex { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; letter-spacing: .1em; color: #7d6b55; }
.sc-moon, .sc-events, .sc-hint, .sc-letter { display: flex; flex-direction: column; gap: 10px; }
.moonrow { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.moonrow p { display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.4; }
.moonrow b { font-size: 18px; letter-spacing: .1em; }
.moonic canvas { display: block; }
.sc-moon ul, .sc-events ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.6; }
.sc-events li { display: flex; flex-direction: column; gap: 4px; }
.sc-events li span { font-size: 13px; color: #5a4d3e; max-inline-size: 18em; }
.sc-hint p { font-size: 17px; max-inline-size: 20em; }
.sc-letter textarea {
  writing-mode: vertical-rl; inline-size: 100%; max-inline-size: 18em; block-size: 7.4em; box-sizing: border-box;
  font: 16px/1.9 var(--f-min); letter-spacing: .06em; color: var(--sumi);
  background: rgba(255, 255, 255, .45); border: 1px dashed rgba(138, 100, 36, .6); border-radius: 3px; padding: 10px 8px; resize: none;
  -webkit-user-select: text; user-select: text;
}
.sc-letter textarea:focus { outline: 2px solid rgba(194, 58, 43, .6); outline-offset: 2px; background: rgba(255, 255, 255, .7); }
.letter-row { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.past { padding: 10px 6px; border-inline-start: 2px solid var(--shu); background: rgba(194, 58, 43, .05); font-size: 16px; }
.past cite { display: block; margin-block-start: .8em; font-size: 12px; font-style: normal; color: #8a6a35; letter-spacing: .1em; }
.small { font-size: 11.5px; letter-spacing: .06em; color: #7a6a55; line-height: 1.6; }
.msg { font-size: 13px; color: #a33223; min-block-size: 1em; }
.sc-act { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.btn-shu, .btn-ink { cursor: pointer; border-radius: 3px; padding: 14px 10px; font: 15px/1.2 var(--f-min); letter-spacing: .2em; }
.btn-shu { background: var(--shu); color: #fff4ec; border: 1px solid #a12c1f; box-shadow: 0 2px 0 #8d2418; }
.btn-ink { background: transparent; color: var(--sumi); border: 1px solid rgba(31, 27, 25, .5); }
.btn-shu:active, .btn-ink:active { transform: translateY(1px); }
.sc-colophon { display: flex; flex-direction: column; gap: 10px; font-size: 12px; line-height: 1.8; color: #6b5d4b; max-inline-size: 22em; padding-inline-start: 6px; border-inline-start: 1px solid rgba(138, 100, 36, .35); }
.sc-colophon p:first-child { font-size: 15px; letter-spacing: .3em; color: #3a2f24; }
.rod {
  position: absolute; top: -10px; bottom: -10px; left: 0; width: 18px; margin-left: -9px; border-radius: 9px;
  background: linear-gradient(90deg, #2a1a0f, #7a5534 45%, #4a301c 70%, #20140b);
  box-shadow: 2px 0 8px rgba(0, 0, 0, .4);
  transition: left .75s cubic-bezier(.3, .7, .2, 1);
}
.rod::before, .rod::after { content: ""; position: absolute; left: -2px; right: -2px; height: 14px; border-radius: 5px; background: linear-gradient(90deg, #8a6424, #f0d891 50%, #8a6424); }
.rod::before { top: -6px; } .rod::after { bottom: -6px; }
#scroll:not(.open) .rod { left: 100%; }
#scroll.closing .rod { left: 100%; transition-duration: .5s; }
.close { position: absolute; top: calc(var(--safe-t) + 6px); right: calc(var(--safe-r) + 8px); width: 40px; height: 40px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid rgba(201, 162, 75, .55); background: rgba(18, 15, 13, .7); display: grid; place-items: center; opacity: 0; transition: opacity .4s ease .35s; }
.close svg { width: 15px; height: 15px; stroke: var(--gold-hi); stroke-width: 1.6; stroke-linecap: round; fill: none; }
#scroll.open .close { opacity: 1; }
.scroll-tip { position: absolute; bottom: calc(var(--safe-b) + 10px); left: 0; right: 0; margin: 0; text-align: center; font: 11.5px/1 var(--f-min); letter-spacing: .14em; color: rgba(246, 231, 193, .8); opacity: 0; transition: opacity .4s ease .5s; pointer-events: none; }
#scroll.open .scroll-tip { opacity: 1; }

/* ---------- 絵葉書 ---------- */
#card { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: calc(var(--safe-t) + 16px) max(16px, var(--safe-r)) calc(var(--safe-b) + 16px) max(16px, var(--safe-l)); background: rgba(8, 6, 5, .72); opacity: 0; transition: opacity .3s ease; }
#card.open { opacity: 1; }
.card-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; max-height: 100%; }
#cardImg { display: block; max-width: min(100%, 460px); max-height: calc(100vh - 190px); max-height: calc(100dvh - 190px); height: auto; border-radius: 2px; box-shadow: 0 20px 50px rgba(0, 0, 0, .6); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; transform: rotate(-.6deg); }
.card-actions { display: flex; gap: 12px; }
.card-actions .btn-ink { color: var(--washi); border-color: rgba(244, 239, 228, .45); }
#card .small { color: rgba(244, 239, 228, .6); margin: 0; }
#card .msg { color: #ffcab8; margin: 0; }

/* ---------- 開幕：屏風がひらく ---------- */
#intro { position: fixed; inset: 0; z-index: 50; background: radial-gradient(120% 80% at 50% 45%, #241c16, #0b0907 70%); perspective: 1500px; perspective-origin: 50% 45%; overflow: hidden; transition: opacity .6s ease; --title: 0; }
#intro.done { opacity: 0; pointer-events: none; }

.ip { position: absolute; top: 0; left: 0; transform-origin: 0 50%; transform-style: preserve-3d; backface-visibility: visible; }
.ip > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; box-shadow: inset 1px 0 0 rgba(240, 216, 145, .55), inset -1px 0 0 rgba(0, 0, 0, .4); }
.ish { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.intro-title, .intro-sub { position: absolute; left: 50%; top: 50%; margin: 0; writing-mode: vertical-rl; transform: translate(-50%, -50%); font-family: var(--f-min); color: var(--gold-hi); opacity: var(--title); text-shadow: 0 0 24px rgba(240, 216, 145, .35); pointer-events: none; }
.intro-title { font-size: clamp(30px, 8vw, 54px); letter-spacing: .5em; font-weight: 600; }
.intro-sub { font-size: 12px; letter-spacing: .6em; transform: translate(calc(-50% - clamp(34px, 8vw, 56px)), -40%); color: rgba(240, 216, 145, .7); }

/* ---------- 画面の形 ---------- */
@media (max-height: 560px) and (orientation: landscape) {
  :root { --dial-h: 96px; }
  .ko-kanji { font-size: min(14vw, 17vh); }

  .ko-v { height: calc(100vh - var(--dial-h) - 40px); }

  .ko-mean { display: none; }
  #hint { bottom: calc(var(--dial-h) + 40px); }
  .tools { bottom: calc(var(--dial-h) + var(--safe-b) + 14px); }
}
@media (min-width: 900px) {
  .ko { right: calc(var(--safe-r) + 36px); top: calc(var(--safe-t) + 34px); }
  .ko-v > span { margin-block-end: 16px; }
  .ko-sekki { font-size: 15px; } .ko-yomi { font-size: 15px; } .ko-mean { font-size: 14px; } .ko-date { font-size: 13px; }
  .seal { inline-size: 40px; block-size: 40px; font-size: 12px; }
  .tools { left: calc(var(--safe-l) + 28px); }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
/* ---- astro.js ---- */
/* うつろい暦 — astro.js
 * 端末内だけで太陽黄経・月相・太陽/月の高度を計算する（通信なし）。
 * 精度: 太陽黄経 ~0.01°（節気・候の日時は数十分以内）、月の位置 ~0.3°。
 */
(function () {
  var U = window.UTSUROI = window.UTSUROI || {};
  var RAD = Math.PI / 180;
  var SYNODIC = 29.530588853;

  function norm360(x) { x %= 360; return x < 0 ? x + 360 : x; }
  function wrap180(x) { x = norm360(x); return x > 180 ? x - 360 : x; }
  function toJD(ms) { return ms / 86400000 + 2440587.5; }
  function fromJD(jd) { return (jd - 2440587.5) * 86400000; }

  // 太陽の視黄経（Meeus 低精度式）
  function sun(jd) {
    var T = (jd - 2451545.0) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var Mr = M * RAD;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr) +
      (0.019993 - 0.000101 * T) * Math.sin(2 * Mr) + 0.000289 * Math.sin(3 * Mr);
    var omega = 125.04 - 1934.136 * T;
    var lambda = norm360(L0 + C - 0.00569 - 0.00478 * Math.sin(omega * RAD));
    var eps = 23.439291 - 0.0130042 * T + 0.00256 * Math.cos(omega * RAD);
    var l = lambda * RAD, e = eps * RAD;
    var ra = norm360(Math.atan2(Math.cos(e) * Math.sin(l), Math.cos(l)) / RAD);
    var dec = Math.asin(Math.sin(e) * Math.sin(l)) / RAD;
    return { lambda: lambda, ra: ra, dec: dec, eps: eps };
  }

  // 月の黄経・黄緯（主要項のみ）
  function moon(jd) {
    var T = (jd - 2451545.0) / 36525;
    var Lp = 218.3164477 + 481267.88123421 * T;
    var D = 297.8501921 + 445267.1114034 * T;
    var M = 357.5291092 + 35999.0502909 * T;
    var Mp = 134.9633964 + 477198.8675055 * T;
    var F = 93.2720950 + 483202.0175233 * T;
    var r = RAD;
    var lon = Lp + 6.289 * Math.sin(Mp * r) + 1.274 * Math.sin((2 * D - Mp) * r) +
      0.658 * Math.sin(2 * D * r) + 0.214 * Math.sin(2 * Mp * r) -
      0.186 * Math.sin(M * r) - 0.114 * Math.sin(2 * F * r) +
      0.059 * Math.sin((2 * D - 2 * Mp) * r) + 0.057 * Math.sin((2 * D - M - Mp) * r) +
      0.053 * Math.sin((2 * D + Mp) * r) + 0.046 * Math.sin((2 * D - M) * r);
    var lat = 5.128 * Math.sin(F * r) + 0.281 * Math.sin((Mp + F) * r) +
      0.278 * Math.sin((Mp - F) * r) + 0.173 * Math.sin((2 * D - F) * r);
    lon = norm360(lon);
    var s = sun(jd);
    var e = s.eps * r, l = lon * r, b = lat * r;
    var ra = norm360(Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)) / r);
    var dec = Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)) / r;
    var elong = norm360(lon - s.lambda);           // 0=新月, 180=満月
    var illum = (1 - Math.cos(elong * r)) / 2;
    return { lambda: lon, lat: lat, ra: ra, dec: dec, elong: elong, illum: illum, age: elong / 360 * SYNODIC };
  }

  function gmst(jd) { return norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0)); }

  // 高度・時角（度）
  function horizontal(ra, dec, jd, lat, lon) {
    var H = wrap180(gmst(jd) + lon - ra);
    var r = RAD;
    var alt = Math.asin(Math.sin(lat * r) * Math.sin(dec * r) + Math.cos(lat * r) * Math.cos(dec * r) * Math.cos(H * r)) / r;
    return { alt: alt, H: H };
  }

  // 観測地：日本時間なら東京、そうでなければタイムゾーンから経度を推定
  var LOC = (function () {
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { }
    if (/Tokyo|Japan/.test(tz)) return { lat: 35.68, lon: 139.77, name: '東京' };
    var off = -new Date().getTimezoneOffset() / 60;
    return { lat: 35, lon: off * 15, name: '' };
  })();

  // 太陽黄経が target になる時刻（JD）を求める
  function solveLongitude(target, jdGuess) {
    var jd = jdGuess;
    for (var i = 0; i < 8; i++) {
      var d = wrap180(target - sun(jd).lambda);
      jd += d / 0.98564736;
      if (Math.abs(d) < 1e-6) break;
    }
    return jd;
  }

  // s: 0..72（0 = 立春の初め＝東風解凍の始まり、黄経315°）
  function sFromLambda(lambda) { return norm360(lambda - 315) / 5; }

  // 日付を含む「立春から次の立春まで」の候の境界 73 点
  function cycleFor(ms) {
    var jd = toJD(ms);
    var lam = sun(jd).lambda;
    var since = norm360(lam - 315);
    var start = solveLongitude(315, jd - since / 0.9856);
    if (start > jd) start = solveLongitude(315, start - 365.2422);
    var b = [start];
    for (var k = 1; k <= 72; k++) b.push(solveLongitude(norm360(315 + 5 * k), start + k * 5.0727));
    var startDate = new Date(fromJD(start));
    return { jd: b, ms: b.map(fromJD), year: startDate.getFullYear() };
  }

  function sOfDate(ms, cycle) {
    var jd = toJD(ms), b = cycle.jd;
    if (jd < b[0]) return 0;
    for (var k = 0; k < 72; k++) if (jd < b[k + 1]) return k + (jd - b[k]) / (b[k + 1] - b[k]);
    return 71.9999;
  }
  function dateOfS(s, cycle) {
    s = ((s % 72) + 72) % 72;
    var k = Math.floor(s), f = s - k, b = cycle.ms;
    return b[k] + (b[k + 1] - b[k]) * f;
  }

  function localMidnight(ms) { var d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  // 候の期間（ローカル日付）: 開始日〜次の候の開始日の前日
  function koRange(k, cycle) {
    var a = localMidnight(cycle.ms[k]);
    var b = localMidnight(cycle.ms[k + 1]) - 86400000;
    if (b < a) b = a;
    return { start: a, end: b };
  }

  // 月相の名前（月齢から）
  function moonName(age) {
    var d = Math.round(age) + 1; // 旧暦の日付に近い数え方
    var e = age / SYNODIC * 360;
    if (e < 7 || e > 353) return { name: '新月', yomi: 'しんげつ' };
    if (Math.abs(e - 180) < 7) return { name: '満月', yomi: 'まんげつ' };
    if (Math.abs(e - 90) < 5) return { name: '上弦の月', yomi: 'じょうげんのつき' };
    if (Math.abs(e - 270) < 5) return { name: '下弦の月', yomi: 'かげんのつき' };
    var table = [
      [2, '二日月', 'ふつかづき'], [3, '三日月', 'みかづき'], [4, '四日月', 'よっかづき'], [5, '五日月', 'いつかづき'],
      [6, '六日月', 'むいかづき'], [7, '七日月', 'なのかづき'], [8, '上弦の月', 'じょうげんのつき'], [9, '九日月', 'ここのかづき'],
      [10, '十日夜の月', 'とおかんやのつき'], [11, '十一日月', 'じゅういちにちづき'], [12, '十二日月', 'じゅうににちづき'],
      [13, '十三夜', 'じゅうさんや'], [14, '小望月', 'こもちづき'], [15, '望月', 'もちづき'], [16, '十六夜', 'いざよい'],
      [17, '立待月', 'たちまちづき'], [18, '居待月', 'いまちづき'], [19, '寝待月', 'ねまちづき'], [20, '更待月', 'ふけまちづき'],
      [21, '二十日余りの月', 'はつかあまりのつき'], [22, '二十二日月', 'にじゅうににちづき'], [23, '下弦の月', 'かげんのつき'],
      [24, '二十四日月', 'にじゅうよっかづき'], [25, '二十五日月', 'にじゅうごにちづき'], [26, '有明月', 'ありあけづき'],
      [27, '有明月', 'ありあけづき'], [28, '有明月', 'ありあけづき'], [29, '晦日月', 'みそかづき'], [30, '晦日月', 'みそかづき']
    ];
    for (var i = 0; i < table.length; i++) if (table[i][0] === d) return { name: table[i][1], yomi: table[i][2] };
    return { name: '晦日月', yomi: 'みそかづき' };
  }

  // 期間中の主な月相（新月・上弦・満月・下弦）
  function moonEvents(fromMs, toMs) {
    var out = [], names = ['新月', '上弦', '満月', '下弦'];
    var step = 6 * 3600000;
    var prev = moon(toJD(fromMs)).elong;
    for (var t = fromMs + step; t <= toMs + 86400000; t += step) {
      var e = moon(toJD(t)).elong;
      for (var q = 0; q < 4; q++) {
        var target = q * 90;
        var a = wrap180(prev - target), c = wrap180(e - target);
        if (a < 0 && c >= 0 && Math.abs(a - c) < 90) {
          // 二分法で精密化
          var lo = t - step, hi = t;
          for (var i = 0; i < 20; i++) {
            var mid = (lo + hi) / 2;
            if (wrap180(moon(toJD(mid)).elong - target) < 0) lo = mid; else hi = mid;
          }
          if (hi >= fromMs && hi < toMs + 86400000) out.push({ ms: hi, name: names[q], q: q });
        }
      }
      prev = e;
    }
    return out;
  }

  // 年中行事（固定日＋太陽黄経から計算するもの）
  function eventsInCycle(cycle) {
    var y0 = cycle.year, ev = [];
    var startMs = cycle.ms[0], endMs = cycle.ms[72];
    function addFixed(m, d, name, note) {
      for (var y = y0; y <= y0 + 1; y++) {
        var t = new Date(y, m - 1, d, 12).getTime();
        if (t >= startMs - 86400000 && t < endMs) ev.push({ ms: t, name: name, note: note });
      }
    }
    function lamDate(l) { return fromJD(solveLongitude(l, toJD(startMs) + norm360(l - 315) / 0.9856)); }
    var risshun = cycle.ms[0];
    ev.push({ ms: risshun - 86400000, name: '節分', note: '立春の前日。豆をまき、季節の変わり目の邪気を払う' });
    addFixed(1, 1, '元日', '年のはじめ。初日の出を拝む');
    addFixed(1, 7, '七草', '春の七草を粥にして一年の無病を願う');
    addFixed(1, 11, '鏡開き', '供えた鏡餅を下ろし、汁粉や雑煮にしていただく');
    addFixed(3, 3, '桃の節句', '雛人形を飾り、女の子の健やかな成長を願う');
    addFixed(5, 5, '端午の節句', '菖蒲湯に入り、鯉のぼりを揚げる');
    addFixed(7, 7, '七夕', '笹に短冊を結び、星に願いをかける');
    addFixed(8, 13, '盆の入り', '迎え火を焚き、祖先の霊を迎える');
    addFixed(9, 9, '重陽の節句', '菊の節句。菊を浮かべた酒で長寿を願う');
    addFixed(11, 15, '七五三', '子どもの成長を祝い、千歳飴を持って詣でる');
    addFixed(12, 13, '正月事始め', '煤払いをして正月の準備を始める日');
    addFixed(12, 31, '大晦日', '年越し蕎麦を食べ、除夜の鐘を聞く');
    ev.push({ ms: lamDate(0), name: '春分', note: '昼と夜の長さがほぼ等しくなる。彼岸の中日' });
    ev.push({ ms: lamDate(0) - 3 * 86400000, name: '春の彼岸入り', note: '春分を中日とする七日間が始まる' });
    ev.push({ ms: lamDate(80), name: '入梅', note: '暦の上での梅雨入り' });
    ev.push({ ms: lamDate(90), name: '夏至', note: '一年で最も昼が長い日' });
    ev.push({ ms: lamDate(117), name: '夏の土用入り', note: '立秋前の約十八日間。鰻を食べる習わしがある' });
    ev.push({ ms: lamDate(180), name: '秋分', note: '昼と夜の長さがほぼ等しくなる。彼岸の中日' });
    ev.push({ ms: lamDate(180) - 3 * 86400000, name: '秋の彼岸入り', note: '秋分を中日とする七日間が始まる' });
    ev.push({ ms: lamDate(270), name: '冬至', note: '一年で最も昼が短い日。柚子湯に入り、南瓜を食べる' });
    ev.push({ ms: risshun + 87 * 86400000, name: '八十八夜', note: '立春から数えて八十八日目。茶摘みの頃' });
    ev.push({ ms: risshun + 209 * 86400000, name: '二百十日', note: '立春から二百十日目。台風の厄日とされる' });
    ev.sort(function (a, b) { return a.ms - b.ms; });
    return ev;
  }

  // 現在時刻の天体情報
  function sky(ms) {
    var jd = toJD(ms);
    var s = sun(jd), m = moon(jd);
    var sh = horizontal(s.ra, s.dec, jd, LOC.lat, LOC.lon);
    var mh = horizontal(m.ra, m.dec, jd, LOC.lat, LOC.lon);
    // 太陽南中高度（その日の）: 90 - lat + dec
    return {
      sunAlt: sh.alt, sunH: sh.H, sunDec: s.dec, noonAlt: 90 - LOC.lat + s.dec,
      moonAlt: mh.alt, moonH: mh.H, moonIllum: m.illum, moonElong: m.elong, moonAge: m.age,
      lambda: s.lambda
    };
  }

  U.Astro = {
    toJD: toJD, fromJD: fromJD, sun: sun, moon: moon, sky: sky, LOC: LOC,
    cycleFor: cycleFor, sOfDate: sOfDate, dateOfS: dateOfS, koRange: koRange,
    sFromLambda: sFromLambda, moonName: moonName, moonEvents: moonEvents,
    eventsInCycle: eventsInCycle, SYNODIC: SYNODIC
  };
})();

/* ---- data.js ---- */
/*
 * うつろい暦 — 七十二候データ（略本暦）
 * U.KO[0] = 東風解凍 … U.KO[71] = 鶏始乳
 * 文章は本サイトのための書き下ろし。各タグは描画・音響エンジンの語彙に対応する。
 */
(function(){
  var U = window.UTSUROI = window.UTSUROI || {};

  U.KO = [
    /* ───────── 立春 ───────── */
    {
      no: 1, kanji: '東風解凍', yomi: 'はるかぜこおりをとく',
      sekki: '立春', sekkiYomi: 'りっしゅん', phase: '初候',
      meaning: '春の東風が吹き、厚い氷を解かしはじめる',

        c.fillStyle = 'rgba(16,12,10,0.55)'; c.fillRect(28, H - 58, Math.min(cw, W - 56), 28);
        c.fillStyle = '#f2e2b4'; c.fillText(cap, 40, H - 39, W - 80);
        cardName = 'utsuroi-' + String(ko.no).padStart(2, '0') + '-' + dd.getFullYear() + ('0' + (dd.getMonth() + 1)).slice(-2) + ('0' + dd.getDate()).slice(-2) + '.png';
        cv.toBlob(function (blob) {
          btn.classList.remove('busy');
          if (!blob) { toast('<b>絵葉書をつくれませんでした</b>'); return; }
          cardBlob = blob; if (cardURL) URL.revokeObjectURL(cardURL); cardURL = URL.createObjectURL(blob);
          $('cardImg').src = cardURL; $('cardImg').alt = ko.kanji + '（' + ko.yomi + '）の絵葉書';
          openCard();
        }, 'image/png');
        haptic(true); if (soundOn) try { sound.stamp(); } catch (e) { }
      } catch (err) { btn.classList.remove('busy'); toast('<b>絵葉書をつくれませんでした</b>'); }
    }, 30);
  }
  var cardEl = $('card');
  function openCard() { lastFocus = document.activeElement; cardEl.hidden = false; void cardEl.offsetWidth; cardEl.classList.add('open'); $('cardMsg').textContent = ''; setTimeout(function () { $('cardSave').focus({ preventScroll: true }); }, 50); }
  function closeCard() { cardEl.classList.remove('open'); setTimeout(function () { cardEl.hidden = true; }, reduced ? 0 : 300); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
  $('cardClose').addEventListener('click', closeCard);
  cardEl.addEventListener('click', function (e) { if (e.target === cardEl) closeCard(); });
  $('cardSave').addEventListener('click', function () {
    if (!cardBlob) return;
    var msg = $('cardMsg');
    msg.textContent = '';
    saveBlob(cardBlob, cardName).then(function (r) {
      msg.textContent = r === 'saved' ? '保存しました' : r === 'shared' ? '' : r === 'downloaded' ? '保存しました' : r === 'declined' ? '' : '画像を長押しして保存してください';
    });
  });
  function saveBlob(blob, name) {
    var tryClaude = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);
    return tryClaude.then(function (dl) {
      if (dl) return dl.save({ filename: name, data: blob }).then(function () { return 'saved'; }, function (e) { return e && e.code === 'declined' ? 'declined' : 'fail'; });
      try {
        var file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: 'うつろい暦' }).then(function () { return 'shared'; }, function (e) { return e && e.name === 'AbortError' ? 'declined' : 'fail'; });
      } catch (e) { }
      if (window.self !== window.top) return 'fail';
      try { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return 'downloaded'; } catch (e) { return 'fail'; }
    });
  }

  // ---------- 案内 ----------
  var hintShown = false, hintGone = false;
  function showHint() { if (hintGone || store.get('hinted')) return; hintShown = true; $('hint').hidden = false; requestAnimationFrame(function () { $('hint').classList.add('show'); }); }
  function hideHint() { if (hintGone) return; hintGone = true; var h = $('hint'); h.classList.remove('show'); setTimeout(function () { h.hidden = true; }, 500); if (hintShown) store.set('hinted', true); askOrientation(); }

  // ---------- 一コマ ----------
  var lastT = performance.now(), frames = 0, slowAcc = 0, fpsT = 0, inkT = 0, sndT = 0, skip = false, hashT = 0;
  function frame(now) {
    var dt = clamp((now - lastT) / 1000, 0, 0.05); lastT = now;
    var idle = now - st.lastInput > 25000 && !st.dragging && st.target == null && Math.abs(st.v) < 0.01;
    if (idle && !reduced) { skip = !skip; if (skip) { requestAnimationFrame(frame); return; } dt = Math.min(0.08, dt * 2); }
    // 動き
    var todayAbs = sTodayAbs();
    if (st.live && !st.dragging && st.target == null && !st.snapping) st.s = todayAbs;
    if (st.target != null) {
      var d = st.target - st.s, k = reduced ? 1 : 1 - Math.exp(-dt * 7.5);
      st.s += d * k;
      if (Math.abs(d) < 0.002) { st.s = st.target; st.target = null; if (st.live) st.s = todayAbs; }
    } else if (st.snapping && !st.dragging) {
      if (Math.abs(st.v) > 1.2) { st.s += st.v * dt; st.v *= Math.exp(-dt / 0.38); }
      else { st.v = 0; st.snapping = false; st.target = Math.floor(st.s) + 0.5; st.live = false; }
    }
    // 候が変わったら
    var p = split(st.s), kAbs = Math.floor(st.s);
    if (kAbs !== st.k) {
      var first = st.k === -1;
      st.k = kAbs; setKo(p, !first);
      if (!first) { haptic(p.k % 3 === 0); if (soundOn) try { sound.tick(p.k); } catch (e) { } }
      clearTimeout(hashT);
      hashT = setTimeout(function () { try { history.replaceState(null, '', '#ko' + (split(st.s).k + 1)); } catch (e) { } }, 800);
    }
    // 傾き
    var tt = st.tiltTarget; st.tilt.x += (tt.x - st.tilt.x) * Math.min(1, dt * 3); st.tilt.y += (tt.y - st.tilt.y) * Math.min(1, dt * 3);
    // 描く
    scene.setState({ s: p.s, timeMs: timeMsFor(st.s), tilt: st.tilt });
    scene.update(dt); scene.render();
    drawDial(st.s, todayAbs);
    updateChip(st.s, todayAbs);
    inkT += dt; if (inkT > 0.25) { inkT = 0; updateInk(); }
    sndT += dt;
    if (soundOn && sound && sndT > 0.12) {
      sndT = 0;
      try { sound.setScene({ sfx: scene.B.sfx, daylight: scene.L.day, dusk: scene.L.dusk, intensity: clamp(Math.abs(st.v) / 20 + (st.dragging ? 0.3 : 0), 0, 1) }); } catch (e) { }
    }
    // 重いときは軽くする
    frames++; fpsT += dt; if (dt > 0.026) slowAcc++;
    if (fpsT > 2.5) {
      if (slowAcc / frames > 0.45) {
        if (scene.quality > 0.55) scene.quality -= 0.15;
        else if (scene.dprScale > 0.7) { scene.dprScale -= 0.15; layout(); }
      }
      frames = 0; slowAcc = 0; fpsT = 0;
    }
    requestAnimationFrame(frame);
  }

  // ---------- 屏風が開く ----------
  function intro(done) {
    var el = $('intro');
    if (reduced) { el.remove(); done(); return; }
    var w = stage.clientWidth, h = stage.clientHeight, N = clamp(Math.round(w / 170), 4, 6), pw = w / N;
    var holder = $('introPanels'), parent = holder, panels = [];
    for (var i = 0; i < N; i++) {
      var pnl = document.createElement('div'); pnl.className = 'ip';
      pnl.style.width = pw + 'px'; pnl.style.height = h + 'px';
      if (i > 0) pnl.style.left = pw + 'px';
      var cv = document.createElement('canvas'); cv.width = Math.round(pw * DPR); cv.height = Math.round(h * DPR);
      try { cv.getContext('2d').drawImage(canvas, Math.round(i * pw * DPR), 0, Math.round(pw * DPR), Math.round(h * DPR), 0, 0, cv.width, cv.height); } catch (e) { }
      pnl.appendChild(cv);
      var sh = document.createElement('div'); sh.className = 'ish'; pnl.appendChild(sh);
      parent.appendChild(pnl); parent = pnl; panels.push({ el: pnl, sh: sh });
    }
    var t0 = null, D0 = 900, D1 = 1700, ended = false;
    function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    function apply(a) {
      var rad = a * Math.PI / 180, total = w * Math.cos(rad);
      panels.forEach(function (p, i) {
        var ang = i === 0 ? a : (i % 2 ? -2 * a : 2 * a);
        p.el.style.transform = (i === 0 ? 'translateX(' + ((w - total) / 2) + 'px) ' : '') + 'rotateY(' + ang + 'deg)';
        p.sh.style.opacity = (i % 2 ? 0.55 : 0.18) * Math.sin(rad);
      });
    }
    apply(84);
    function tick(now) {
      if (ended) return;
      if (t0 == null) t0 = now;
      var e = now - t0;
      if (e < D0) { el.style.setProperty('--title', String(Math.min(1, e / 500))); holder.style.opacity = '0'; }
      else {
        var k = Math.min(1, (e - D0) / D1); el.style.setProperty('--title', String(Math.max(0, 1 - k * 3)));
        holder.style.opacity = String(Math.min(1, k * 6));
        apply(84 * (1 - ease(k)));
        if (k >= 1) { finish(); return; }
      }
      requestAnimationFrame(tick);
    }
    function finish() {
      if (ended) return; ended = true; apply(0);
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 700);
      done();
    }
    el.addEventListener('pointerdown', function () { finish(); }, { once: true });
    requestAnimationFrame(tick);
    setTimeout(function () { if (soundOn) try { sound.whoosh(); } catch (e) { } }, D0);
  }

  // ---------- はじまり ----------
  function start() {
    layout();
    window.addEventListener('resize', function () { clearTimeout(start.rt); start.rt = setTimeout(layout, 120); });
    var p = split(st.s);
    scene.setState({ s: p.s, timeMs: timeMsFor(st.s), tilt: { x: 0, y: 0 } });
    scene.prewarm(0.2);
    scene.render(); drawDial(st.s, sTodayAbs()); updateChip(st.s, sTodayAbs()); updateInk();
    st.k = Math.floor(st.s); setKo(p, false);
    document.addEventListener('visibilitychange', function () {
      if (!sound) return;
      try { if (document.hidden) sound.stop(); else if (soundOn) sound.start(); } catch (e) { }
    });
    var wantSound = store.get('sound');
    $('btnSound').querySelector('.lab').textContent = 'おと';
    intro(function () {
      document.documentElement.classList.add('ready');
      setTimeout(showHint, reduced ? 200 : 1500);
      if (wantSound) $('btnSound').classList.add('remember');
    });
    lastT = performance.now();
    requestAnimationFrame(frame);
  }

  // GitHub Pages などに置いたとき：一度ひらけば通信なしでも開ける
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { }

  U.app = { state: st, scene: scene, openScroll: openScroll, makePostcard: makePostcard, goTo: goTo };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
